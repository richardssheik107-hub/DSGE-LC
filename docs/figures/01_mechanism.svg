<text x="355.0" y="266" fill="#173F52" font-size="21" text-anchor="middle" font-weight="700">PHYSICAL MARKET</text>
<text x="355.0" y="298" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">Production Q and flexible use D_s</text>
<text x="355.0" y="325" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">Spot P clears: Q + N + α_I I_-</text>
<text x="355.0" y="352" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">= D_s + C_- + I</text>
<text x="355.0" y="379" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">Inventory I responds to P and F</text>
<text x="355.0" y="406" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">E04, E09, E24, E25</text>
<rect x="770" y="235" width="550" height="260" rx="13" fill="#FFF5E8" stroke="#B27B35" stroke-width="1.8"/>
<text x="1045.0" y="266" fill="#6A4A1A" font-size="21" text-anchor="middle" font-weight="700">RISK SHARING</text>
<text x="1045.0" y="298" fill="#6A4A1A" font-size="18" text-anchor="middle" font-weight="400">New commitment C: next-month use</text>
<text x="1045.0" y="325" fill="#6A4A1A" font-size="18" text-anchor="middle" font-weight="400">Net hedge H = α_I I − C</text>
<text x="1045.0" y="352" fill="#6A4A1A" font-size="18" text-anchor="middle" font-weight="400">F = μ_P − (v_P / T) H</text>
<text x="1045.0" y="379" fill="#6A4A1A" font-size="18" text-anchor="middle" font-weight="400">Three futures positions sum to zero</text>
<text x="1045.0" y="406" fill="#6A4A1A" font-size="18" text-anchor="middle" font-weight="400">E19–E27</text>
<rect x="80" y="630" width="550" height="240" rx="13" fill="#ECF5EF" stroke="#57886A" stroke-width="1.8"/>
<text x="355.0" y="661" fill="#2C5039" font-size="21" text-anchor="middle" font-weight="700">INVESTMENT AND CAPACITY</text>
<text x="355.0" y="693" fill="#2C5039" font-size="18" text-anchor="middle" font-weight="400">Capacity service → project values W</text>
<text x="355.0" y="720" fill="#2C5039" font-size="18" text-anchor="middle" font-weight="400">J → construction B → ramp-up Z → K_e</text>
<text x="355.0" y="747" fill="#2C5039" font-size="18" text-anchor="middle" font-weight="400">New projects change future supply</text>
<text x="355.0" y="774" fill="#2C5039" font-size="18" text-anchor="middle" font-weight="400">E06–E16</text>
<rect x="770" y="630" width="550" height="240" rx="13" fill="#F1ECF8" stroke="#8067AB" stroke-width="1.8"/>
<text x="1045.0" y="661" fill="#3D2D58" font-size="21" text-anchor="middle" font-weight="700">CONSISTENT EXPECTATIONS</text>
<text x="1045.0" y="693" fill="#3D2D58" font-size="18" text-anchor="middle" font-weight="400">s′ = Φ(s, G(s), ε′)</text>
