<text x="70" y="79" fill="#5D7280" font-size="14" text-anchor="start" font-weight="400">Full condition evaluation and deterministic anchor implemented | Full stochastic policy iteration remains pending.</text>
<rect x="150" y="112" width="740" height="70" rx="13" fill="#F2F5F8" stroke="#7B8E9D" stroke-width="1.8"/>
<text x="520.0" y="153.0" fill="#2C4152" font-size="18" text-anchor="middle" font-weight="400">Freeze commodity scope, units, monthly timing and research goal</text>
<rect x="150" y="220" width="740" height="88" rx="13" fill="#F2F5F8" stroke="#7B8E9D" stroke-width="1.8"/>
<text x="520.0" y="257.5" fill="#2C4152" font-size="17" text-anchor="middle" font-weight="400">Verify nine-state transitions, innovation kernel and rate support.</text>
<text x="520.0" y="284.5" fill="#2C4152" font-size="17" text-anchor="middle" font-weight="400">Declare domain, discount decay, TVC and investment curvature.</text>
<rect x="150" y="348" width="740" height="70" rx="13" fill="#F2F5F8" stroke="#7B8E9D" stroke-width="1.8"/>
<text x="520.0" y="389.0" fill="#2C4152" font-size="18" text-anchor="middle" font-weight="400">Initialize one policy G_t: 7 + L + R prices, quantities and values</text>
<rect x="150" y="458" width="740" height="70" rx="13" fill="#F0F7FB" stroke="#236C8A" stroke-width="1.8"/>
<text x="520.0" y="499.0" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">Generate successor states S′ from candidate controls and joint kernel</text>
<rect x="150" y="568" width="740" height="88" rx="13" fill="#F1ECF8" stroke="#8067AB" stroke-width="1.8"/>
<text x="520.0" y="605.5" fill="#3D2D58" font-size="18" text-anchor="middle" font-weight="400">Same Φ, Π and G → μ_P, v_P, E Q′, E W′; use current b_t</text>
<text x="520.0" y="632.5" fill="#3D2D58" font-size="18" text-anchor="middle" font-weight="400">Recompute expectations after changing controls.</text>
<rect x="150" y="697" width="740" height="88" rx="13" fill="#F0F7FB" stroke="#236C8A" stroke-width="1.8"/>
<text x="520.0" y="734.5" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">Solve seven current conditions and L + R value recursions</text>
<text x="520.0" y="761.5" fill="#173F52" font-size="18" text-anchor="middle" font-weight="400">E09, E16, E04, E23–E25, E27 plus E14–E15.</text>
<rect x="150" y="826" width="740" height="70" rx="13" fill="#F0F7FB" stroke="#236C8A" stroke-width="1.8"/>
<text x="520.0" y="867.0" fill="#173F52" font-size="19" text-anchor="middle" font-weight="400">Update price, quantity and value policies</text>
<polygon points="520.0,936 740,989.0 520.0,1042 300,989.0" fill="#FFF5E8" stroke="#B27B35" stroke-width="1.8"/>
<text x="520.0" y="982.5" fill="#6A4A1A" font-size="17" text-anchor="middle" font-weight="700">Policy change AND</text>
<text x="520.0" y="1005.5" fill="#6A4A1A" font-size="17" text-anchor="middle" font-weight="700">economic residuals small?</text>
<rect x="150" y="1090" width="740" height="88" rx="13" fill="#ECF5EF" stroke="#57886A" stroke-width="1.8"/>
<text x="520.0" y="1127.5" fill="#2C5039" font-size="18" text-anchor="middle" font-weight="400">Recompute original FOC/KKT, both clearing conditions</text>
<text x="520.0" y="1154.5" fill="#2C5039" font-size="18" text-anchor="middle" font-weight="400">and value recursions at independent state points.</text>
<rect x="150" y="1218" width="740" height="88" rx="13" fill="#ECF5EF" stroke="#57886A" stroke-width="1.8"/>
<text x="520.0" y="1255.5" fill="#2C5039" font-size="17" text-anchor="middle" font-weight="400">Check bounded objectives, finite moments, discount decay / TVC,</text>
<text x="520.0" y="1282.5" fill="#2C5039" font-size="17" text-anchor="middle" font-weight="400">successor-domain invariance and commitment feasibility.</text>
<polygon points="520.0,1347 740,1400.0 520.0,1453 300,1400.0" fill="#FFF5E8" stroke="#B27B35" stroke-width="1.8"/>
<text x="520.0" y="1393.5" fill="#6A4A1A" font-size="17" text-anchor="middle" font-weight="700">Numerical equilibrium</text>
<text x="520.0" y="1416.5" fill="#6A4A1A" font-size="17" text-anchor="middle" font-weight="700">acceptance passed?</text>
<rect x="150" y="1501" width="740" height="88" rx="13" fill="#ECF5EF" stroke="#57886A" stroke-width="1.8"/>
<text x="520.0" y="1538.5" fill="#2C5039" font-size="17" text-anchor="middle" font-weight="400">Proceed to synthetic parameter recovery and identification.</text>
<text x="520.0" y="1565.5" fill="#2C5039" font-size="17" text-anchor="middle" font-weight="400">Real-data estimation has separate evidence and data gates.</text>
