<text x="1045.0" y="693" fill="#3D2D58" font-size="18" text-anchor="middle" font-weight="400">S′ = Φ(S, G_t(S), ε′)</text>
<text x="1045.0" y="720" fill="#3D2D58" font-size="18" text-anchor="middle" font-weight="400">Same next-period policy and joint shock weights:</text>
<text x="1045.0" y="747" fill="#3D2D58" font-size="18" text-anchor="middle" font-weight="400">μ_P, v_P, E Q′, E W′</text>
